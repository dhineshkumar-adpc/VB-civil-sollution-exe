name: Build Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bundle_netbird:
        description: 'Bundle NetBird installers inside the app (more antivirus warnings - keep OFF unless needed)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Prepare resources folder
        run: mkdir -p build-res/netbird

      - name: Bundle NetBird installers (optional, OFF by default)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_netbird }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL -o build-res/netbird/netbird-win7.exe https://github.com/netbirdio/netbird/releases/download/v0.25.3/netbird_installer_0.25.3_windows_amd64.exe
          TAG=$(gh api repos/netbirdio/netbird/releases/latest --jq .tag_name)
          curl -fL -o build-res/netbird/netbird-latest.exe "https://github.com/netbirdio/netbird/releases/download/$TAG/netbird_installer_${TAG#v}_windows_amd64.exe"

      - run: npm install

      - name: Build app folder (signed if CSC_LINK secret exists)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "No signing certificate - building unsigned"
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run dist -- --publish never
          ls "dist/win-unpacked"

      - name: Read version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer_out

      - name: Sign installer (only if CSC_LINK secret exists)
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:CSC_LINK) { Write-Host "No certificate - installer left unsigned"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CSC_LINK))
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                  Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          & $tool.FullName sign /f $pfx /p $env:CSC_KEY_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem installer_out\*.exe).FullName
          Remove-Item $pfx -Force

      - name: SHA256 checksum
        run: |
          cd installer_out
          sha256sum *.exe > SHA256.txt
          cat SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VB-Civil-Solution-Installer
          path: |
            installer_out/*.exe
            installer_out/SHA256.txt

      - name: Publish GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_out/*.exe
            installer_out/SHA256.txt
